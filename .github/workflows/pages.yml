name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Markdown site
        run: node scripts/build-site.mjs

      - name: Validate generated site
        run: |
          for page in index smart-accounts privacy network communications developers governance download; do
            test -f "dist/$page.html"
          done
          for language in en zh ru ja ko es ar fr de pt hi id tr it vi th uk pl nl sw; do
            test -f "dist/$language/index.html"
            test -f "dist/$language/download.html"
          done
          node --check scripts/build-site.mjs
          node --check assets/translator.js
          node -e "const c=require('./site.config.json'); if (c.tkmchain.version !== 'v1.21.24') throw new Error('Unexpected TKMChain release version'); if (!c.xmrig.version) throw new Error('Missing XMRig release version');"
          grep -q 'Shield3 让网络' dist/zh/index.html
          grep -q 'TKM Phone 和 EmailVM' dist/zh/index.html
          grep -q 'v1.21.24' dist/zh/download.html
          grep -q 'v6.26.0-tkm.8' dist/zh/download.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload generated site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
